<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link rel="icon" href="assets/favicon.ico" />
    <title>museum</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-container">
          <a class="logo-link" href="#"><div class="logo"></div></a>
          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__item">

              <li class="nav__item">
                <a href="#" class="nav__link">Gallery</a>

        </div>
      </div>

          </div>
        </div>
      </section>
      <section class="section">
        <div class="container" id="visiting"></div>
      </section>
      <section class="section"><div class="container"></div></section>
      <section class="section section--video">
        <div class="container"></div>
